<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конвейер разработки агентами — схема для печати</title>
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  /* ширина в CSS-пикселях: 1062px ≈ 281 мм, то есть A4 в альбомной ориентации с полями 8 мм */
  #bpmn{width:1062px;height:446px}
  .bjs-powered-by{display:none}
  @page{size:A4 landscape;margin:8mm}
  @media print{
    html,body{background:#fff;min-height:0}
    body{display:block}
  }
</style>
</head>
<body>
<div id="bpmn"></div>
<script src="https://cdn.jsdelivr.net/npm/bpmn-js@17/dist/bpmn-navigated-viewer.production.min.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var width = parseInt(qs.get('w') || '0', 10) || 1062;
  var host = document.getElementById('bpmn');
  var viewer = new BpmnJS({ container: host });

  // рамка всей схемы: заодно даёт точные пропорции листа
  function bbox() {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    viewer.get('elementRegistry').forEach(function (el) {
      if (!el.parent || el.type === 'bpmn:Process' || el.type === 'bpmn:Collaboration') return;
      if (el.waypoints) {
        el.waypoints.forEach(function (p) { see(p.x, p.y); });
      } else if (typeof el.x === 'number' && typeof el.width === 'number') {
        see(el.x, el.y); see(el.x + el.width, el.y + el.height);
      }
      function see(x, y) {
        if (x < minX) minX = x; if (y < minY) minY = y;
        if (x > maxX) maxX = x; if (y > maxY) maxY = y;
      }
    });
    return { w: maxX - minX, h: maxY - minY };
  }

  fetch('pipeline.bpmn')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (xml) { return viewer.importXML(xml); })
    .then(function () {
      var box = bbox();
      var height = Math.round(width * box.h / box.w);
      host.style.width = width + 'px';
      host.style.height = height + 'px';
      viewer.get('canvas').zoom('fit-viewport');
      document.body.setAttribute('data-size', width + 'x' + height);
      document.title = 'Схема готова';
    })
    .catch(function (err) {
      host.textContent = 'Ошибка отрисовки: ' + err.message;
    });
})();
</script>
</body>
</html>
